<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ペット代理海洋散骨サービスの提案用お問い合わせフォーム。">
  <title>お問い合わせ | 海へ、想いを。</title>
  <link rel="stylesheet" href="style.css?v=20261118-tablet-photo">
  <script src="demo-form.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">本文へ移動</a>
  <header class="site-header"><div class="header-inner">
    <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true"></span><span>海へ、想いを。<small>ペット海洋散骨サービス</small></span></a>
    <nav aria-label="主なメニュー"><a class="text-link" href="index.html"><span aria-hidden="true">←</span> サービス紹介</a></nav>
  </div></header>
  <main class="contact-page" id="main">
    <div class="contact-layout wrap">
      <div class="contact-intro"><p class="eyebrow"><span class="phrase">ペットの</span><span class="phrase">代理海洋散骨</span></p><h1>お問い合わせ</h1><p><span class="phrase">お預かり方法や</span><span class="phrase">散骨の流れなど、</span><span class="phrase">気になることを</span><span class="phrase">お聞かせください。</span></p>
        <figure><img src="assets/coast.jpg" width="1536" height="1024" alt="静かな海と緑の岬"><figcaption><span class="phrase">宮津周辺の海を</span><span class="phrase">イメージした生成画像</span></figcaption></figure>
      </div>
      <form class="contact-form" aria-describedby="demo-instructions">
        <p id="demo-instructions" class="form-note"><strong>提案用デモ</strong><br><span class="phrase">フォームの入力を</span><span class="phrase">お試しいただけます。</span><span class="phrase">送信機能は未設定です。</span><span class="phrase">架空の情報を</span><span class="phrase">ご入力ください。</span></p>
        <noscript><p><span class="phrase">入力確認を試すには、</span><span class="phrase">ブラウザで</span><span class="phrase">JavaScriptを</span><span class="phrase">有効にしてください。</span></p></noscript>
        <label for="demo-name">お名前 <span class="required">必須</span></label>
        <input id="demo-name" type="text" autocomplete="off" maxlength="80" required placeholder="例　山田 花子">
        <label for="demo-email">メールアドレス <span class="required">必須</span></label>
        <input id="demo-email" type="email" autocomplete="off" maxlength="254" required placeholder="例　sample@example.com">
        <label for="demo-topic">ご相談の種類 <span class="required">必須</span></label>
        <select id="demo-topic" required>
          <option value="" selected>選択してください</option>
          <option value="ご遺骨のお預かりについて">ご遺骨のお預かり</option><option>散骨の流れについて</option><option>料金について</option><option>その他</option>
        </select>
        <label for="demo-message">お問い合わせ内容 <span class="required">必須</span></label>
        <textarea id="demo-message" rows="5" maxlength="1000" required placeholder="例　自宅で保管している&#10;ペットの遺骨について&#10;相談したいです。"></textarea>
        <button class="button" type="submit" disabled><span><span class="phrase">入力を確認する</span><span class="phrase">（デモ）</span></span> <span aria-hidden="true">→</span></button>
        <p id="form-result" class="form-result" role="status"></p>
      </form>
    </div>
  </main>
  <footer class="site-footer"><div class="wrap"><a href="index.html"><span aria-hidden="true">←</span> サービス紹介へ戻る</a><small><span class="phrase">ペット海洋散骨サービスの</span><span class="phrase">提案用デモ ·</span> <span class="phrase">名称は仮案</span></small></div></footer>
</body>
</html>
